[package]
name = "cadence"
version = "0.1.0"
edition = "2021"
description = "Cadence Music Server — local files + Qobuz, written in Rust"
authors = ["Your Name"]

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qobuz-api = "2.0"
reqwest = { version = "0.13", features = ["blocking", "rustls"] }
anyhow = "1"
thiserror = "1"

# For future local library
# sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
# lofty = "0.21"
# walkdir = "2"