[package]
name = "cadence"
version = "0.1.0"
edition = "2021"
description = "Cadence Music Server — local files + Qobuz, written in Rust"
authors = ["Your Name"]

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qobuz-api = "2.0"
reqwest = { version = "0.13", features = ["blocking", "rustls", "stream", "json"] }
anyhow = "1"
thiserror = "1"
fuzzy-matcher = "0.3"
strsim = "0.11"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
lofty = "0.25"
walkdir = "2"

urlencoding = "2"
tower-http = { version = "0.7.1", features = ["cors"] }
tokio-util = { version = "0.7.20", features = ["io"] }

chrono = "0.4"

symphonia = { version = "0.5", features = ["flac"] }

rubato = "5"
audioadapter-buffers = "5"

libflac-rs = "0.143"

regex = "1"
base64 = "0.22"