<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cadence Queue Test</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2rem;
            background: #fafafa;
        }

        h1 {
            color: #222;
        }

        input[type="text"] {
            width: 70%;
            padding: 0.4rem;
            margin: 0.2rem 0;
        }

        button {
            margin: 0.3rem;
            padding: 0.4rem 0.8rem;
        }

        audio {
            width: 100%;
            margin: 1rem 0;
        }

        pre {
            background: #fff;
            padding: 1rem;
            border: 1px solid #ddd;
            overflow-x: auto;
        }

        .status {
            color: #555;
            margin: 0.5rem 0;
        }

        .mode {
            margin: 0.5rem 0;
        }

        label {
            display: block;
            margin-top: 0.4rem;
        }

        canvas {
            width: 100%;
            height: 120px;
            background: #fff;
            border: 1px solid #ddd;
            margin: 0.5rem 0 0.2rem 0;
        }
    </style>
</head>

<body>
    <h1>Cadence Queue Test</h1>

    <div class="mode">
        <label>
            <input type="radio" name="mode" value="normal" checked> Normal stream
        </label>
        <label>
            <input type="radio" name="mode" value="gapless"> Gapless stream
        </label>
    </div>

    <p>
        <label>Normal stream URL or track_id:<br>
            <input type="text" id="url" placeholder="http://localhost:3000/stream_from_track?track_id=13176086"
                size="80">
        </label>
        <label>Gapless stream URL or track_id:<br>
            <input type="text" id="url-gapless"
                placeholder="http://localhost:3000/stream_from_track_gapless?track_id=13176086" size="80">
        </label>
        <button onclick="play()">Play</button>
    </p>

    <audio id="player" controls></audio>
    <canvas id="waveform" width="800" height="120"></canvas>
    <div class="status" id="dr">DR: –</div>
    <div class="status" id="status">Ready</div>

    <p>
        <button onclick="prev()">Previous</button>
        <button onclick="next()">Next</button>
        <button onclick="refresh()">Refresh queue</button>
        <button onclick="clearQueue()">Clear</button>
    </p>

    <h2>Queue</h2>
    <pre id="queue">loading…</pre>

    <script>
        const SERVER = "http://localhost:3000";
        const player = document.getElementById("player");
        const status = document.getElementById("status");
        const queueEl = document.getElementById("queue");
        const canvas = document.getElementById("waveform");
        const drEl = document.getElementById("dr");

        let currentWaveform = null;

        function setStatus(msg) {
            status.textContent = msg;
        }

        function showDr(score) {
            drEl.textContent = (score == null) ? "DR: –" : "DR: " + Number(score).toFixed(1);
        }

        function currentMode() {
            return document.querySelector('input[name="mode"]:checked').value;
        }

        function drawStereoWaveform(progress) {
            const ctx = canvas.getContext("2d");
            const w = canvas.width;
            const h = canvas.height;
            ctx.clearRect(0, 0, w, h);

            if (!currentWaveform) {
                ctx.fillStyle = "#999";
                ctx.font = "14px system-ui";
                ctx.fillText("No waveform", 10, h / 2);
                return;
            }

            const left = currentWaveform.l || [];
            const right = currentWaveform.r || [];
            const mid = h / 2;
            const barW = w / Math.max(left.length, 1);

            ctx.strokeStyle = "#ddd";
            ctx.beginPath();
            ctx.moveTo(0, mid);
            ctx.lineTo(w, mid);
            ctx.stroke();

            ctx.fillStyle = "#4a90d9";
            left.forEach((p, i) => {
                const barH = p * (mid - 4);
                ctx.fillRect(i * barW, mid - barH, Math.max(barW - 1, 1), barH);
            });

            ctx.fillStyle = "#e67e22";
            right.forEach((p, i) => {
                const barH = p * (mid - 4);
                ctx.fillRect(i * barW, mid, Math.max(barW - 1, 1), barH);
            });

            if (progress >= 0 && progress <= 1) {
                ctx.fillStyle = "#c0392b";
                ctx.fillRect(progress * w, 0, 2, h);
            }
        }

        function applyCurrent(current) {
            currentWaveform = null;
            showDr(null);

            if (!current) {
                drawStereoWaveform(0);
                return;
            }

            if (current.waveform) {
                try {
                    currentWaveform = JSON.parse(current.waveform);
                } catch (e) {
                    console.warn("bad waveform json", e);
                }
            }
            if (current.dr_score != null) {
                showDr(current.dr_score);
            }
            const progress = player.duration ? player.currentTime / player.duration : 0;
            drawStereoWaveform(progress);
        }

        async function play() {
            const mode = currentMode();
            const inputId = mode === "gapless" ? "url-gapless" : "url";
            let url = document.getElementById(inputId).value.trim();
            if (!url) return;

            if (/^\d+$/.test(url)) {
                const endpoint = mode === "gapless" ? "/stream_from_track_gapless" : "/stream_from_track";
                url = SERVER + `${endpoint}?track_id=${url}`;
            }

            player.src = url;
            player.play().catch(e => setStatus("Play error: " + e.message));
            setStatus(`Playing (${mode}): ${url}`);
            setTimeout(refresh, 500);
        }

        async function next() {
            player.src = SERVER + "/queue/next_stream";
            player.play().catch(e => setStatus("Next error: " + e.message));
            setStatus("Skipped to next");
            setTimeout(refresh, 500);
        }

        async function prev() {
            player.src = SERVER + "/queue/previous_stream";
            player.play().catch(e => setStatus("Previous error: " + e.message));
            setStatus("Skipped to previous");
            setTimeout(refresh, 500);
        }

        async function clearQueue() {
            await fetch(SERVER + "/queue/clear", { method: "POST" });
            setStatus("Queue cleared");
            applyCurrent(null);
            refresh();
        }

        async function refresh() {
            try {
                const r = await fetch(SERVER + "/queue");
                const data = await r.json();
                queueEl.textContent = JSON.stringify(data, null, 2);
                applyCurrent(data.current);
            } catch (e) {
                queueEl.textContent = "Error loading queue: " + e.message;
            }
        }

        player.addEventListener("timeupdate", () => {
            if (player.duration) {
                drawStereoWaveform(player.currentTime / player.duration);
            }
        });

        player.addEventListener("ended", () => {
            setStatus("Track ended — loading next");
            next();
        });

        player.addEventListener("error", () => {
            setStatus("Player error");
        });

        refresh();
        setInterval(refresh, 3000);
    </script>
</body>

</html>
